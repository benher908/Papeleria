services:
  - type: web
    name: papeleria-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --no-frozen-lockfile
    startCommand: pnpm --filter @papeleria/api start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SYNC_PAIRING_CODE
        sync: false
      - key: PORT
        value: "10000"
